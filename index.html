<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perapih Log JSON & JWT</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e2e5ea;--ac:#2563eb;--ok:#16a34a;--er:#dc2626;--code:#f1f3f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1a1d23;--tx:#e8eaee;--mu:#9aa1ad;--bd:#2c313a;--ac:#6ea0ff;--ok:#4ade80;--er:#f87171;--code:#14171c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111317;--card:#1a1d23;--tx:#e8eaee;--mu:#9aa1ad;--bd:#2c313a;--ac:#6ea0ff;--ok:#4ade80;--er:#f87171;--code:#14171c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
textarea{width:100%;min-height:170px;resize:vertical;background:var(--code);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
label{font-size:13px;color:var(--mu);display:flex;gap:6px;align-items:center}
pre{margin:0;background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:520px;overflow-y:auto}
h2{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.ok{color:var(--ok)}.er{color:var(--er)}
.note{font-size:13px;color:var(--mu);margin:8px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Perapih Log JSON &amp; JWT</h1>
<p class="sub">Tempel log Flutter/terminal apa adanya. Prefix log dihapus otomatis, lalu JSON dirapikan atau JWT digabung dan didecode. Semua diproses di browser Anda.</p>

<div class="card">
<textarea id="in" spellcheck="false" placeholder="Tempel log di sini (JSON atau JWT)..."></textarea>
<div class="row">
<button id="go">Rapikan</button>
<button class="sec" id="clr">Bersihkan</button>
<label><input type="checkbox" id="red"> Samarkan token</label>
<label>Indent
<select id="ind"><option>2</option><option>4</option></select></label>
</div>
</div>

<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const PREFIX=/^.*?I\/flutter\s*\(\s*\d+\):\s?(?:[│|]\s?(?:[^\w\s{}\["\]]{1,3}\s?)?)?/;
const BARE=/^\s*[│|]\s?(?:[^\w\s{}\["\]]{1,3}\s?)?/;

function clean(t){
  return t.split(/\r?\n/).map(l=>{
    if(/I\/flutter/.test(l)) return l.replace(PREFIX,'');
    return l.replace(BARE,'');
  }).join('\n').replace(/^[\s]*[┌└├─┄┈╭╰]+.*$/gm,'').trim();
}

function repair(s){
  let st=[],inStr=false,esc=false,out='';
  for(const c of s){
    out+=c;
    if(inStr){ if(esc)esc=false; else if(c==='\\')esc=true; else if(c==='"')inStr=false; continue; }
    if(c==='"')inStr=true;
    else if(c==='{')st.push('}');
    else if(c==='[')st.push(']');
    else if(c==='}'||c===']')st.pop();
  }
  if(inStr)out+='"';
  out=out.replace(/[,\s]+$/,'');
  out=out.replace(/:\s*$/,': null').replace(/("[^"]*")\s*$/,(m,g)=>m);
  return out+st.reverse().join('');
}

function tryJSON(t){
  let s=t.trim();
  const note=[];
  s=s.replace(/^\s*/,'');
  if(!/^[\[{]/.test(s)){
    const i=s.search(/[\[{]/);
    if(i>0 && !/^"/.test(s)){ s=s.slice(i); note.push('Teks sebelum JSON dibuang.'); }
    else if(/^"/.test(s)){ s='{'+s; note.push('Fragmen dibungkus dengan { }.'); }
  }
  try{ return {v:JSON.parse(s),note}; }catch(e){}
  let s2=s.replace(/,\s*$/,'');
  try{ return {v:JSON.parse(s2),note:[...note,'Koma di akhir dibuang.']}; }catch(e){}
  // drop unbalanced trailing closers
  let r=repair(s2);
  try{ return {v:JSON.parse(r),note:[...note,'Log terpotong/tidak seimbang, tanda penutup ditambahkan otomatis.']}; }catch(e){}
  // trailing-comma tolerant
  r=r.replace(/,\s*([}\]])/g,'$1');
  try{ return {v:JSON.parse(r),note:[...note,'JSON diperbaiki otomatis.']}; }catch(e){ return {err:e.message}; }
}

const JWT_RE=/^[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]*$/;
function b64(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  const bin=atob(s);
  return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
}
function maskJWT(s){return s.replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.?[A-Za-z0-9_-]*/g,'<REDACTED_JWT>').replace(/(Bearer\s+)eyJ[A-Za-z0-9_-]*/g,'$1<REDACTED_JWT>');}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function fmtDate(sec){const d=new Date(sec*1000);return d.toLocaleString('id-ID',{dateStyle:'full',timeStyle:'medium'});}

let copyStore={};
function block(id,title,text,tag){
  copyStore[id]=text;
  return `<div class="card"><h2><span>${title}</span><span><span class="tag">${tag||''}</span> <button class="sec" onclick="cp('${id}',this)">Salin</button></span></h2><pre>${esc(text)}</pre></div>`;
}
window.cp=async(id,b)=>{
  try{await navigator.clipboard.writeText(copyStore[id]);b.textContent='Tersalin';}
  catch(e){const t=document.createElement('textarea');t.value=copyStore[id];document.body.appendChild(t);t.select();try{document.execCommand('copy');b.textContent='Tersalin';}catch(_){b.textContent='Gagal';}t.remove();}
  setTimeout(()=>b.textContent='Salin',1500);
};

function run(){
  copyStore={};
  const raw=$('in').value;
  const ind=+$('ind').value, red=$('red').checked;
  const out=$('out');
  if(!raw.trim()){out.innerHTML='';return;}
  const c=clean(raw);
  const joined=c.replace(/\s+/g,'').replace(/^Bearer/i,'');
  let html='';
  if(JWT_RE.test(joined)){
    const [h,p,sig]=joined.split('.');
    let H,P,err='';
    try{H=JSON.parse(b64(h));P=JSON.parse(b64(p));}catch(e){err=e.message;}
    if(err){
      html=`<div class="card er">Terlihat seperti JWT tapi gagal didecode: ${esc(err)}. Mungkin ada baris log yang terpotong atau hilang.</div>`;
    }else{
      html+=block('jwt','JWT (satu baris)',red?'<REDACTED_JWT>':joined,`${joined.length} karakter`);
      let status='';
      if(P.exp){
        const now=Date.now()/1000, left=P.exp-now;
        status=left>0?`<span class="ok">Masih berlaku, sisa ${Math.floor(left/3600)} jam ${Math.floor(left%3600/60)} menit</span>`:`<span class="er">Sudah kedaluwarsa ${Math.floor(-left/3600)} jam ${Math.floor(-left%3600/60)} menit lalu</span>`;
      }
      let times='';
      if(P.iat)times+=`<div>iat (dibuat): ${esc(fmtDate(P.iat))}</div>`;
      if(P.exp)times+=`<div>exp (berakhir): ${esc(fmtDate(P.exp))}</div>`;
      if(times||status)html+=`<div class="card"><h2>Waktu &amp; status</h2>${times}<div>${status}</div></div>`;
      html+=`<div class="grid">${block('h','Header',JSON.stringify(H,null,ind))}${block('pl','Payload',JSON.stringify(P,null,ind),'didecode')}</div>`;
      html+=`<p class="note">Signature ${sig?'ada ('+sig.length+' karakter)':'kosong'} dan tidak diverifikasi di sini. Payload JWT bisa dibaca siapa saja, jadi jangan bagikan token aktif.</p>`;
    }
  }else{
    const r=tryJSON(c);
    if(r.err){
      html=`<div class="card er">Tidak bisa diparse sebagai JSON: ${esc(r.err)}</div>`+block('raw','Teks setelah prefix dibersihkan',c);
    }else{
      let txt=JSON.stringify(r.v,null,ind);
      if(red)txt=maskJWT(txt);
      html+=block('json','JSON rapi',txt,'valid');
      if(r.note.length)html+=`<p class="note">${r.note.map(esc).join(' ')}</p>`;
      const m=txt.match(/eyJ[A-Za-z0-9_-]{20,}/);
      if(m&&!red)html+=`<p class="note">Ada JWT di dalam JSON. Jika token terpotong di log, tempel token utuhnya ke kotak input untuk didecode.</p>`;
    }
  }
  out.innerHTML=html;
}
$('go').onclick=run;
$('clr').onclick=()=>{$('in').value='';$('out').innerHTML='';};
$('red').onchange=run;$('ind').onchange=run;
$('in').addEventListener('paste',()=>setTimeout(run,50));
</script>
</body>
</html>
